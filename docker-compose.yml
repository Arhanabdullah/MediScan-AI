services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediscan
      POSTGRES_USER: mediscan
      POSTGRES_PASSWORD: mediscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan -d mediscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mediscan:mediscan@db:5432/mediscan
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-to-a-long-random-value-before-production}
      OCR_BACKEND: ${OCR_BACKEND:-auto}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
